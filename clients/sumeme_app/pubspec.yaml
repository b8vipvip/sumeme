name: sumeme_app
description: SuMeMe client with a bundled LobeHub UI for Android and Windows.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_windows: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/lobehub/
    - assets/control-panel/
