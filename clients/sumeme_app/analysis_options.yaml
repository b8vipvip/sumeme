analyzer:
  exclude:
    - build/**
  errors:
    # Flutter 3.44 deprecates DropdownButtonFormField.value in favor of
    # initialValue. The client keeps the controlled value until the form field
    # migration is completed without changing selection behavior.
    deprecated_member_use: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    use_super_parameters: true
