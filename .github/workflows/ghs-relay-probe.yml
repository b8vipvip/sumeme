name: GHS relay capability probe

on:
  push:
    branches:
      - agent/ghs-emergency-diagnose
    paths:
      - .github/workflows/ghs-relay-probe.yml

permissions:
  contents: write

jobs:
  probe:
    name: Publish sanitized relay capability probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure pinned GHS connection
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${SSH_PORT}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/adob_deploy"
          printf '%s\n' "${SSH_HOST_KEY}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/adob_deploy" "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host adob-production
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/adob_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 "${HOME}/.ssh/config"
          ssh adob-production 'printf "ghs-relay-probe-ready\n"'

      - name: Probe relay without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          ssh adob-production 'python3 -' > "${RUNNER_TEMP}/relay-probe.json" <<'PY'
          import datetime as dt
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          def read_environment(path: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                      value = value[1:-1]
                  values[key.strip()] = value
              return values

          def sanitize_message(value: object) -> str | None:
              text = str(value or '').strip()
              if not text:
                  return None
              text = re.sub(r'(?i)bearer\s+[A-Za-z0-9._~+/=-]+', 'Bearer [REDACTED]', text)
              text = re.sub(r'(?i)sk-[A-Za-z0-9_-]{8,}', 'sk-[REDACTED]', text)
              text = re.sub(r'https?://\S+', '[URL]', text)
              text = re.sub(
                  r'(?i)(api[_-]?key|token|password|secret)(\s*[=:]\s*)[^\s,;]+',
                  r'\1\2[REDACTED]',
                  text,
              )
              return text[:240]

          def classify(body: bytes) -> dict[str, object]:
              try:
                  value = json.loads(body.decode('utf-8', errors='replace'))
              except json.JSONDecodeError:
                  return {'response_format': 'non_json'}
              if not isinstance(value, dict):
                  return {'response_format': type(value).__name__}
              result: dict[str, object] = {'response_format': 'json'}
              error = value.get('error')
              if isinstance(error, dict):
                  for source, target in (('code', 'error_code'), ('type', 'error_type')):
                      item = str(error.get(source) or '').strip()
                      if re.fullmatch(r'[A-Za-z0-9._:-]{1,120}', item):
                          result[target] = item
                  message = sanitize_message(error.get('message'))
                  if message:
                      result['error_message'] = message
              detail = sanitize_message(value.get('detail'))
              if detail:
                  result['detail'] = detail
              return result

          def request_json(url: str, api_key: str, *, payload: dict | None = None) -> tuple[int | None, bytes]:
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(url, data=data, method='GET' if data is None else 'POST')
              request.add_header('Authorization', f'Bearer {api_key}')
              request.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return response.status, response.read(50000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(50000)
              except Exception as exc:
                  return None, json.dumps({'detail': type(exc).__name__}).encode()

          environment = read_environment(Path('/opt/sumeme/.env'))
          base_url = environment.get('OPENAI_RELAY_BASE_URL', '').rstrip('/')
          api_key = environment.get('OPENAI_RELAY_API_KEY', '')
          configured_model = environment.get('OPENAI_CHAT_MODEL', '')

          models_status, models_body = request_json(f'{base_url}/models', api_key)
          model_ids: list[str] = []
          try:
              models_value = json.loads(models_body.decode('utf-8', errors='replace'))
              raw_models = models_value.get('data') if isinstance(models_value, dict) else []
              if isinstance(raw_models, list):
                  model_ids = sorted({
                      str(item.get('id'))
                      for item in raw_models
                      if isinstance(item, dict) and item.get('id')
                  })
          except json.JSONDecodeError:
              pass

          chat_payload = {
              'model': configured_model,
              'stream': False,
              'messages': [{'role': 'user', 'content': 'Reply with RELAY_PROBE_OK only.'}],
          }
          chat_status, chat_body = request_json(
              f'{base_url}/chat/completions',
              api_key,
              payload=chat_payload,
          )

          result = {
              'schema_version': 1,
              'mode': 'GHS',
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'configured_model': configured_model,
              'models': {
                  'status': models_status,
                  'count': len(model_ids),
                  'configured_model_listed': configured_model in model_ids,
                  'ids': model_ids[:50],
                  **({} if models_status and 200 <= models_status < 300 else classify(models_body)),
              },
              'chat': {
                  'status': chat_status,
                  'ok': bool(chat_status and 200 <= chat_status < 300),
                  **({} if chat_status and 200 <= chat_status < 300 else classify(chat_body)),
              },
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          python3 -m json.tool "${RUNNER_TEMP}/relay-probe.json" >/dev/null

      - name: Publish relay probe to GHS status branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS_REPO="${RUNNER_TEMP}/sumeme-ghs-status"
          rm -rf "${STATUS_REPO}"
          git clone --depth=1 --branch ghs-status \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${STATUS_REPO}"
          cd "${STATUS_REPO}"
          git config user.name 'sumeme-ghs-status-bot'
          git config user.email 'sumeme-ghs-status-bot@users.noreply.github.com'
          mkdir -p status
          cp "${RUNNER_TEMP}/relay-probe.json" status/relay-probe.json
          git add status/relay-probe.json
          if git diff --cached --quiet; then
            echo 'Relay probe is unchanged.'
            exit 0
          fi
          git commit -m 'status(ghs): update relay capability probe'
          git push origin HEAD:ghs-status
