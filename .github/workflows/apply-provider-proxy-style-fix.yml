name: Apply provider proxy style fix once

on:
  push:
    branches: [agent/remote-ai-provider-proxy]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'style: use TypeError for invalid tag containers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-ai-provider-proxy
      - name: Apply exact one-line fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/ai-provider-proxy/app/main.py')
          content = path.read_text(encoding='utf-8')
          old = '            raise ValueError("tags must be arrays")'
          new = '            raise TypeError("tags must be arrays")'
          if content.count(old) != 1:
              raise SystemExit('expected exactly one target line')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/apply-provider-proxy-style-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/ai-provider-proxy/app/main.py
          git commit -m 'style: use TypeError for invalid tag containers'
          git push origin HEAD:agent/remote-ai-provider-proxy
