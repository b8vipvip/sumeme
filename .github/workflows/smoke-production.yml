name: Smoke production

on:
  workflow_dispatch:
    inputs:
      required:
        description: Fail the workflow when any smoke check fails
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: sumeme-production-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 20

    steps:
      - name: Check out trusted smoke scripts
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Run production smoke test
        id: smoke
        continue-on-error: ${{ github.event_name == 'schedule' || inputs.required == false }}
        env:
          DEPLOY_DIR: /opt/sumeme
        run: bash scripts/smoke-test.sh

      - name: Print sanitized result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/opt/sumeme/.deploy/smoke/latest.json')
          if not path.exists():
              print('No smoke result was written.')
              raise SystemExit(0)
          value = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'generated_at': value.get('generated_at'),
              'duration_seconds': value.get('duration_seconds'),
              'overall': value.get('overall'),
              'checks': value.get('checks'),
              'error_codes': value.get('error_codes'),
          }, ensure_ascii=False, indent=2))
          PY
