name: Client source check

on:
  pull_request:
    paths:
      - "clients/sumeme_app/**"
      - "scripts/materialize-flutter-client.py"
      - ".github/workflows/client-source-check.yml"
  push:
    branches: [main]
    paths:
      - "clients/sumeme_app/**"
      - "scripts/materialize-flutter-client.py"
      - ".github/workflows/client-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Materialize native client
        run: >-
          python3 scripts/materialize-flutter-client.py
          --output "${RUNNER_TEMP}/sumeme_app"
      - name: Analyze and test Flutter source
        working-directory: ${{ runner.temp }}/sumeme_app
        run: |
          flutter analyze
          flutter test
