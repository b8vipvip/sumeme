name: CI

on:
  # Feature branches are validated by pull_request below. Running both push and
  # pull_request for an open agent/* branch duplicates every GitHub-hosted job.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/memory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/memory-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app

  simulated-acceptance:
    name: Simulated end-to-end acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/memory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/memory-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run deterministic simulated acceptance
        run: PYTHONPATH=. pytest -q tests/test_simulated_acceptance.py
      - name: Publish acceptance classification
        run: |
          {
            echo '## SuMeMe simulated acceptance'
            echo
            echo '- Result: `simulated_pass`'
            echo '- Relay: deterministic OpenAI-compatible mock for models, chat and embeddings'
            echo '- Memory: MemPalace + Letta write/recall, optional degradation and required fail-closed'
            echo '- Isolation: account, Vault and account/service namespaces'
            echo '- Live provider status is tracked separately and is not represented by this result.'
          } >> "${GITHUB_STEP_SUMMARY}"

  provider-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ai-provider-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-provider-proxy/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app
      - name: Build provider proxy container
        run: docker build -t sumeme-ai-provider-proxy:test .

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile operational Python scripts
        run: python -m compileall scripts tests
      - name: Run reliability unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Exercise disk preflight JSON
        env:
          DEPLOY_DIR: ${{ github.workspace }}
          DISK_WARN_PERCENT: 99
          DISK_FAIL_PERCENT: 100
          DISK_MIN_FREE_GIB: 0
        run: bash scripts/preflight-disk.sh --json | python -m json.tool >/dev/null
      - name: Dry-run runtime cleanup
        env:
          DEPLOY_DIR: ${{ runner.temp }}/sumeme-cleanup-test
        run: bash scripts/cleanup-runtime.sh --dry-run

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  prepare-lobehub-image-ghs:
    name: Prepare patched LobeHub image (GHS)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT == 'github-hosted-ssh'
    needs: [gateway, simulated-acceptance, provider-proxy, reliability, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOBEHUB_UPSTREAM_REF: v2.2.11
      LOBEHUB_IMAGE_TAG: sumeme-lobehub:2.2.11-auth-assets-1
      SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
      SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
      SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
    steps:
      - name: Check out SuMeMe release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/sumeme_deploy_key"
          chmod 600 "${HOME}/.ssh/sumeme_deploy_key"
          printf '%s\n' "${SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Check whether the patched image is already present
        id: remote-image
        run: |
          set -euo pipefail
          if ssh -i "${HOME}/.ssh/sumeme_deploy_key" \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "docker image inspect '${LOBEHUB_IMAGE_TAG}' >/dev/null 2>&1"; then
            echo 'present=true' >> "${GITHUB_OUTPUT}"
            echo "Patched image already exists on the production host."
          else
            echo 'present=false' >> "${GITHUB_OUTPUT}"
            echo "Patched image is absent and will be built from the pinned upstream tag."
          fi

      - name: Check out pinned LobeHub source
        if: steps.remote-image.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          repository: lobehub/lobehub
          ref: ${{ env.LOBEHUB_UPSTREAM_REF }}
          path: .upstream/lobehub
          persist-credentials: false

      - name: Patch only the missing auth SPA packaging instruction
        if: steps.remote-image.outputs.present != 'true'
        run: |
          set -euo pipefail
          python scripts/patch-lobehub-auth-assets.py .upstream/lobehub/Dockerfile
          grep -Fx 'COPY --from=builder /app/public/_spa-auth /app/public/_spa-auth' \
            .upstream/lobehub/Dockerfile

      - name: Build the pinned patched LobeHub image
        if: steps.remote-image.outputs.present != 'true'
        run: |
          set -euo pipefail
          docker build --pull \
            --tag "${LOBEHUB_IMAGE_TAG}" \
            .upstream/lobehub
          docker image inspect "${LOBEHUB_IMAGE_TAG}" >/dev/null

      - name: Transfer the immutable image to production
        if: steps.remote-image.outputs.present != 'true'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/sumeme-lobehub-2.2.11-auth-assets-1.tar.gz"
          remote_archive="/tmp/sumeme-lobehub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          docker save "${LOBEHUB_IMAGE_TAG}" | gzip -1 > "${archive}"
          scp -i "${HOME}/.ssh/sumeme_deploy_key" \
            -P "${SSH_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${archive}" "${SSH_USER}@${SSH_HOST}:${remote_archive}"
          ssh -i "${HOME}/.ssh/sumeme_deploy_key" \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "set -e; gzip -dc '${remote_archive}' | docker load; rm -f '${remote_archive}'; docker image inspect '${LOBEHUB_IMAGE_TAG}' >/dev/null"

  deploy-production-self-hosted:
    name: Deploy production (VSR fallback)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT != 'github-hosted-ssh'
    needs: [gateway, simulated-acceptance, provider-proxy, reliability, compose]
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 60
    concurrency:
      group: sumeme-production
      cancel-in-progress: false

    steps:
      - name: Check out exact verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out release
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${GITHUB_SHA}"
          echo "ADOB mode: VSR"
          echo "Verified release SHA: ${actual}"

      - name: Verify the pinned patched LobeHub image is preloaded
        run: |
          docker image inspect sumeme-lobehub:2.2.11-auth-assets-1 >/dev/null || {
            echo 'Missing sumeme-lobehub:2.2.11-auth-assets-1 on the self-hosted production runner.' >&2
            exit 1
          }

      - name: Deploy exact verified release to VPS using VSR
        env:
          ADOB_MODE: VSR
          DEPLOY_DIR: /opt/sumeme
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production-v2.sh "${GITHUB_SHA}"

      - name: Print deployment state
        if: always()
        run: |
          echo "ADOB mode: VSR"
          echo "Expected release: ${GITHUB_SHA}"
          echo "Current release: $(cat /opt/sumeme/.deploy/current_sha 2>/dev/null || echo unknown)"
          tail -n 20 /opt/sumeme/.deploy/history.log 2>/dev/null || true

  deploy-production-ssh:
    name: Deploy production (GHS)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT == 'github-hosted-ssh'
    needs:
      - gateway
      - simulated-acceptance
      - provider-proxy
      - reliability
      - compose
      - prepare-lobehub-image-ghs
    concurrency:
      group: sumeme-production
      cancel-in-progress: false
    uses: b8vipvip/ADOB/.github/workflows/deploy-via-ssh.yml@8d0858ccf534c8ee95cf14688ce8b2184dd2a197
    with:
      adob_mode: GHS
      project_name: sumeme
      ssh_host: ${{ vars.SUMEME_VPS_HOST }}
      ssh_port: ${{ vars.SUMEME_VPS_PORT || '22' }}
      ssh_user: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
      deploy_path: /opt/sumeme
      deploy_script: scripts/deploy-production-v2.sh
      public_health_url: https://sumeme.mv3.cn/sumeme-health
      retain_staging_releases: 3
    secrets:
      ssh_private_key: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
      ssh_host_key: ${{ secrets.SUMEME_SSH_HOST_KEY }}
