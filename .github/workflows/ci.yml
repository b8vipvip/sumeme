name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/memory-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app

  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile operational Python scripts
        run: python -m compileall scripts tests
      - name: Run reliability unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Exercise disk preflight JSON
        env:
          DEPLOY_DIR: ${{ github.workspace }}
          DISK_WARN_PERCENT: 99
          DISK_FAIL_PERCENT: 100
          DISK_MIN_FREE_GIB: 0
        run: bash scripts/preflight-disk.sh --json | python -m json.tool >/dev/null
      - name: Dry-run runtime cleanup
        env:
          DEPLOY_DIR: ${{ runner.temp }}/sumeme-cleanup-test
        run: bash scripts/cleanup-runtime.sh --dry-run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  diagnose-deployment-lock:
    name: Temporary read-only deployment diagnostics
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/diagnose-deploy-lock') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/diagnose-deploy-lock')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/sumeme_diag"
          printf '%s\n' "${SSH_HOST_KEY}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/sumeme_diag" "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host sumeme-production
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/sumeme_diag
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Inspect deployment lock and bounded process state
        shell: bash
        run: |
          ssh sumeme-production 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== current/deploying SHA ==='
          cat /opt/sumeme/.deploy/current_sha 2>/dev/null || true
          cat /opt/sumeme/.deploy/deploying_sha 2>/dev/null || true
          echo '=== lock owner metadata ==='
          cat /opt/sumeme/.deploy/deploy.lock.owner 2>/dev/null || true
          echo '=== lock file users ==='
          fuser -v /opt/sumeme/.deploy/deploy.lock 2>&1 || true
          echo '=== related processes ==='
          ps -eo pid,ppid,stat,etime,cmd --sort=etime \
            | grep -E 'deploy-production|docker compose|buildx|buildkit|rsync|smoke-test' \
            | grep -v grep \
            | tail -n 40 || true
          echo '=== docker compose status ==='
          cd /opt/sumeme && docker compose ps || true
          echo '=== disk ==='
          df -h /opt/sumeme || true
          REMOTE

  deploy-production-self-hosted:
    name: Deploy production (self-hosted fallback)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT != 'github-hosted-ssh'
    needs: [gateway, reliability, compose]
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 60
    concurrency:
      group: sumeme-production
      cancel-in-progress: false

    steps:
      - name: Check out exact verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out release
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${GITHUB_SHA}"
          echo "Verified release SHA: ${actual}"

      - name: Deploy exact verified release to VPS
        env:
          DEPLOY_DIR: /opt/sumeme
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production.sh "${GITHUB_SHA}"

      - name: Print deployment state
        if: always()
        run: |
          echo "Expected release: ${GITHUB_SHA}"
          echo "Current release: $(cat /opt/sumeme/.deploy/current_sha 2>/dev/null || echo unknown)"
          tail -n 20 /opt/sumeme/.deploy/history.log 2>/dev/null || true

  deploy-production-ssh:
    name: Deploy production (ADOB SSH)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT == 'github-hosted-ssh'
    needs: [gateway, reliability, compose]
    concurrency:
      group: sumeme-production
      cancel-in-progress: false
    uses: b8vipvip/ADOB/.github/workflows/deploy-via-ssh.yml@621a5fc3d0876a5a33560468ae6073ec3ac640a4
    with:
      project_name: sumeme
      ssh_host: ${{ vars.SUMEME_VPS_HOST }}
      ssh_port: ${{ vars.SUMEME_VPS_PORT || '22' }}
      ssh_user: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
      deploy_path: /opt/sumeme
      deploy_script: scripts/deploy-production.sh
      public_health_url: https://sumeme.mv3.cn/health
      retain_staging_releases: 3
    secrets:
      ssh_private_key: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
      ssh_host_key: ${{ secrets.SUMEME_SSH_HOST_KEY }}
