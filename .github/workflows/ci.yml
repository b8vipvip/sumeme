name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  auto-fix-provider-proxy:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/remote-ai-provider-proxy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-ai-provider-proxy
      - name: Apply exact exception type fix and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/ai-provider-proxy/app/main.py')
          content = path.read_text(encoding='utf-8')
          old = '            raise ValueError("tags must be arrays")'
          new = '            raise TypeError("tags must be arrays")'
          if old in content:
              if content.count(old) != 1:
                  raise SystemExit('expected exactly one target line')
              path.write_text(content.replace(old, new), encoding='utf-8')
          elif new not in content:
              raise SystemExit('target line is missing')
          PY
          rm -f .github/workflows/apply-provider-proxy-style-fix.yml
          git checkout a955323c50224b0b88b931e23c41cf805185d53b -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/ai-provider-proxy/app/main.py .github/workflows/ci.yml
          git add -u .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: use TypeError for invalid tag containers'
          git push origin HEAD:agent/remote-ai-provider-proxy

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/memory-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app

  provider-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-provider-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-provider-proxy/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app
      - name: Build provider proxy container
        run: docker build -t sumeme-ai-provider-proxy:test .

  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile operational Python scripts
        run: python -m compileall scripts tests
      - name: Run reliability unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Exercise disk preflight JSON
        env:
          DEPLOY_DIR: ${{ github.workspace }}
          DISK_WARN_PERCENT: 99
          DISK_FAIL_PERCENT: 100
          DISK_MIN_FREE_GIB: 0
        run: bash scripts/preflight-disk.sh --json | python -m json.tool >/dev/null
      - name: Dry-run runtime cleanup
        env:
          DEPLOY_DIR: ${{ runner.temp }}/sumeme-cleanup-test
        run: bash scripts/cleanup-runtime.sh --dry-run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  deploy-production-self-hosted:
    name: Deploy production (self-hosted fallback)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT != 'github-hosted-ssh'
    needs: [gateway, provider-proxy, reliability, compose]
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 60
    concurrency:
      group: sumeme-production
      cancel-in-progress: false

    steps:
      - name: Check out exact verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out release
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${GITHUB_SHA}"
          echo "Verified release SHA: ${actual}"

      - name: Deploy exact verified release to VPS
        env:
          DEPLOY_DIR: /opt/sumeme
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production.sh "${GITHUB_SHA}"

      - name: Print deployment state
        if: always()
        run: |
          echo "Expected release: ${GITHUB_SHA}"
          echo "Current release: $(cat /opt/sumeme/.deploy/current_sha 2>/dev/null || echo unknown)"
          tail -n 20 /opt/sumeme/.deploy/history.log 2>/dev/null || true

  deploy-production-ssh:
    name: Deploy production (ADOB SSH)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT == 'github-hosted-ssh'
    needs: [gateway, provider-proxy, reliability, compose]
    concurrency:
      group: sumeme-production
      cancel-in-progress: false
    uses: b8vipvip/ADOB/.github/workflows/deploy-via-ssh.yml@9fdc399498c7a42deb1e0dbff706cd08ac691617
    with:
      project_name: sumeme
      ssh_host: ${{ vars.SUMEME_VPS_HOST }}
      ssh_port: ${{ vars.SUMEME_VPS_PORT || '22' }}
      ssh_user: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
      deploy_path: /opt/sumeme
      deploy_script: scripts/deploy-production.sh
      public_health_url: https://sumeme.mv3.cn/health
      retain_staging_releases: 3
    secrets:
      ssh_private_key: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
      ssh_host_key: ${{ secrets.SUMEME_SSH_HOST_KEY }}
