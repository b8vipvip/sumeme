name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/memory-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app

  provider-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-provider-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-provider-proxy/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall app
      - name: Build provider proxy container
        run: docker build -t sumeme-ai-provider-proxy:test .

  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile operational Python scripts
        run: python -m compileall scripts tests
      - name: Run reliability unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Exercise disk preflight JSON
        env:
          DEPLOY_DIR: ${{ github.workspace }}
          DISK_WARN_PERCENT: 99
          DISK_FAIL_PERCENT: 100
          DISK_MIN_FREE_GIB: 0
        run: bash scripts/preflight-disk.sh --json | python -m json.tool >/dev/null
      - name: Dry-run runtime cleanup
        env:
          DEPLOY_DIR: ${{ runner.temp }}/sumeme-cleanup-test
        run: bash scripts/cleanup-runtime.sh --dry-run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  ghs-relay-revalidate:
    name: Revalidate relay chat (GHS, read-only)
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/ghs-relay-revalidate-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned GHS connection
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${SSH_PORT}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/adob_deploy"
          printf '%s\n' "${SSH_HOST_KEY}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/adob_deploy" "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host adob-production
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/adob_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 "${HOME}/.ssh/config"
          ssh adob-production 'printf "ghs-relay-revalidation-ready\n"'

      - name: Require successful models and chat responses
        shell: bash
        run: |
          set -euo pipefail
          ssh adob-production 'python3 -' <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          def read_environment(path: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                      value = value[1:-1]
                  values[key.strip()] = value
              return values

          def request_json(url: str, api_key: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  method="GET" if data is None else "POST",
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, response.read(50000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(50000)
              except Exception as exc:
                  return None, json.dumps({"detail": type(exc).__name__}).encode()

          def safe_error(body: bytes) -> dict[str, str]:
              try:
                  value = json.loads(body.decode("utf-8", errors="replace"))
              except json.JSONDecodeError:
                  return {"response_format": "non_json"}
              if not isinstance(value, dict):
                  return {"response_format": type(value).__name__}
              error = value.get("error") if isinstance(value.get("error"), dict) else {}
              message = str(error.get("message") or value.get("detail") or "").strip()
              message = re.sub(r"(?i)bearer\s+\S+", "Bearer [REDACTED]", message)
              message = re.sub(r"(?i)sk-[A-Za-z0-9_-]{8,}", "sk-[REDACTED]", message)
              return {
                  "error_code": str(error.get("code") or "")[:120],
                  "error_type": str(error.get("type") or "")[:120],
                  "error_message": message[:240],
              }

          env = read_environment(Path("/opt/sumeme/.env"))
          base_url = env.get("OPENAI_RELAY_BASE_URL", "").rstrip("/")
          api_key = env.get("OPENAI_RELAY_API_KEY", "")
          model = env.get("OPENAI_CHAT_MODEL", "")

          models_status, models_body = request_json(f"{base_url}/models", api_key)
          model_ids: list[str] = []
          try:
              value = json.loads(models_body.decode("utf-8", errors="replace"))
              data = value.get("data") if isinstance(value, dict) else []
              if isinstance(data, list):
                  model_ids = sorted(
                      str(item.get("id"))
                      for item in data
                      if isinstance(item, dict) and item.get("id")
                  )
          except json.JSONDecodeError:
              pass

          chat_status, chat_body = request_json(
              f"{base_url}/chat/completions",
              api_key,
              {
                  "model": model,
                  "stream": False,
                  "messages": [
                      {"role": "user", "content": "Reply with RELAY_PROBE_OK only."}
                  ],
              },
          )

          result = {
              "configured_model": model,
              "models_status": models_status,
              "configured_model_listed": model in model_ids,
              "chat_status": chat_status,
              "chat_ok": bool(chat_status and 200 <= chat_status < 300),
          }
          if not result["chat_ok"]:
              result.update(safe_error(chat_body))
          print("relay_revalidation=" + json.dumps(result, ensure_ascii=False, separators=(",", ":")))

          if not models_status or not 200 <= models_status < 300:
              raise SystemExit(1)
          if model not in model_ids:
              raise SystemExit(1)
          if not chat_status or not 200 <= chat_status < 300:
              raise SystemExit(1)
          PY

  deploy-production-self-hosted:
    name: Deploy production (VSR fallback)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT != 'github-hosted-ssh'
    needs: [gateway, provider-proxy, reliability, compose]
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 60
    concurrency:
      group: sumeme-production
      cancel-in-progress: false

    steps:
      - name: Check out exact verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out release
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${GITHUB_SHA}"
          echo "ADOB mode: VSR"
          echo "Verified release SHA: ${actual}"

      - name: Deploy exact verified release to VPS using VSR
        env:
          ADOB_MODE: VSR
          DEPLOY_DIR: /opt/sumeme
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production.sh "${GITHUB_SHA}"

      - name: Print deployment state
        if: always()
        run: |
          echo "ADOB mode: VSR"
          echo "Expected release: ${GITHUB_SHA}"
          echo "Current release: $(cat /opt/sumeme/.deploy/current_sha 2>/dev/null || echo unknown)"
          tail -n 20 /opt/sumeme/.deploy/history.log 2>/dev/null || true

  deploy-production-ssh:
    name: Deploy production (GHS)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SUMEME_DEPLOY_TRANSPORT == 'github-hosted-ssh'
    needs: [gateway, provider-proxy, reliability, compose]
    concurrency:
      group: sumeme-production
      cancel-in-progress: false
    uses: b8vipvip/ADOB/.github/workflows/deploy-via-ssh.yml@8d0858ccf534c8ee95cf14688ce8b2184dd2a197
    with:
      adob_mode: GHS
      project_name: sumeme
      ssh_host: ${{ vars.SUMEME_VPS_HOST }}
      ssh_port: ${{ vars.SUMEME_VPS_PORT || '22' }}
      ssh_user: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
      deploy_path: /opt/sumeme
      deploy_script: scripts/deploy-production.sh
      public_health_url: https://sumeme.mv3.cn/health
      retain_staging_releases: 3
    secrets:
      ssh_private_key: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
      ssh_host_key: ${{ secrets.SUMEME_SSH_HOST_KEY }}
