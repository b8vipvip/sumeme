name: Server UI check

on:
  pull_request:
    paths:
      - "web/server-ui/**"
      - "docker-compose.yml"
      - "scripts/health-check.sh"
      - "scripts/smoke-public-ui.py"
      - "tests/test_public_ui_delivery_contract.py"
      - ".github/workflows/server-ui-check.yml"
  push:
    branches: [main]
    paths:
      - "web/server-ui/**"
      - "docker-compose.yml"
      - "scripts/health-check.sh"
      - "scripts/smoke-public-ui.py"
      - "tests/test_public_ui_delivery_contract.py"
      - ".github/workflows/server-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile public UI smoke test
        run: python -m py_compile scripts/smoke-public-ui.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/server-ui/static/app.js
          node --check web/server-ui/static/chat-write.js
          node --check web/server-ui/static/chat-attachments.js
          node --check web/server-ui/static/chat-interventions.js
      - name: Run frontend and backend-boundary contract
        run: python -m unittest tests.test_public_ui_delivery_contract -v
      - name: Build server UI container
        run: docker build -t sumeme-web:test web/server-ui
      - name: Start isolated LobeHub fixture, gateway and server UI
        run: |
          set -euo pipefail
          docker network create sumeme-ui-test
          fixture="${RUNNER_TEMP}/lobe-fixture.conf"
          cat > "${fixture}" <<'EOF'
          server {
            listen 3210;
            location = /api/auth/get-session {
              default_type application/json;
              return 200 '{"session":null,"user":null}';
            }
            location = /trpc/topic.queryTopics {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"items":[{"id":"topic-fixture","agentId":"agent-fixture","title":"Fixture conversation","updatedAt":"2026-07-31T10:00:00Z","lastMessage":{"content":"Fixture preview"}}]}}}}';
            }
            location = /trpc/topic.getTopicTranscript {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"items":[{"id":"message-fixture","role":"assistant","content":"Fixture transcript","createdAt":"2026-07-31T10:01:00Z"},{"id":"tool-message-fixture","role":"tool","content":"","plugin":{"toolCallId":"call-fixture"}}]}}}}';
            }
            location = /trpc/agent.queryAgents {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"items":[{"id":"agent-fixture","title":"Fixture agent"}]}}}}';
            }
            location = /trpc/file.checkFileHash {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"isExist":false}}}}';
            }
            location = /trpc/upload.createS3PreSignedUrl {
              default_type application/json;
              return 200 '{"result":{"data":{"json":"https://storage.example.invalid/signed-upload"}}}';
            }
            location = /trpc/file.createFile {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"id":"file-fixture","url":"https://storage.example.invalid/file-fixture"}}}}';
            }
            location = /trpc/aiAgent.execAgent {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"agentId":"agent-fixture","assistantMessageId":"assistant-fixture","autoStarted":true,"createdAt":"2026-07-31T10:02:00Z","message":"started","operationId":"operation-fixture","status":"running","success":true,"timestamp":"2026-07-31T10:02:00Z","topicId":"topic-fixture","userMessageId":"user-message-fixture"}}}}';
            }
            location = /trpc/aiAgent.getOperationStatus {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"currentState":{"metadata":{"agentId":"agent-fixture","topicId":"topic-fixture"},"status":"waiting_for_human"},"hasError":false,"isCompleted":false,"operationId":"operation-fixture"}}}}';
            }
            location = /trpc/aiAgent.getPendingInterventions {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"pendingInterventions":[{"lastModified":"2026-07-31T10:03:00Z","operationId":"operation-fixture","pendingToolsCalling":[{"apiName":"fixtureTool","arguments":"{\"value\":1}","id":"call-fixture","identifier":"fixture-plugin"}],"status":"waiting_for_human","stepCount":2,"type":"tool_approval"}],"timestamp":"2026-07-31T10:03:00Z","totalCount":1}}}}';
            }
            location = /trpc/aiAgent.processHumanIntervention {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"message":"Human intervention processed successfully","operationId":"operation-fixture","scheduled":true,"success":true}}}}';
            }
            location /_spa-auth/ {
              default_type application/javascript;
              return 200 'console.log("auth fixture")';
            }
            location / {
              default_type text/plain;
              return 200 'lobe backend fixture';
            }
          }
          EOF
          docker run -d \
            --name lobe \
            --network sumeme-ui-test \
            -v "${fixture}:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          docker run -d \
            --name memory-gateway \
            --network sumeme-ui-test \
            nginx:1.27-alpine
          docker run -d \
            --name sumeme-web-test \
            --network sumeme-ui-test \
            -p 127.0.0.1:18080:80 \
            sumeme-web:test
      - name: Verify frontend, login route and LobeHub proxy
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            echo 'sumeme-web did not become ready.' >&2
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/healthz | python -m json.tool >/dev/null
          page="$(curl --fail --silent http://127.0.0.1:18080/)"
          signin="$(curl --fail --silent 'http://127.0.0.1:18080/signin?callbackUrl=%2F')"
          grep -F '<title>SuMeMe · 服务端</title>' <<<"${page}"
          grep -F '服务端管理中心' <<<"${page}"
          grep -F 'SUMEME OPERATIONS CENTER' <<<"${page}"
          grep -F 'id="topicList"' <<<"${page}"
          grep -F '/assets/conversation-style' <<<"${page}"
          grep -F '/assets/attachment-style' <<<"${page}"
          grep -F '/assets/intervention-style' <<<"${page}"
          grep -F '/assets/chat-runtime' <<<"${page}"
          grep -F '/assets/chat-attachments' <<<"${page}"
          grep -F '/assets/chat-interventions' <<<"${page}"
          grep -F '登录 SuMeMe' <<<"${signin}"
          curl --fail --silent http://127.0.0.1:18080/static/admin.css >/dev/null
          curl --fail --silent http://127.0.0.1:18080/static/app.js >/dev/null
          conversation_css="$(curl --fail --silent http://127.0.0.1:18080/assets/conversation-style)"
          attachment_css="$(curl --fail --silent http://127.0.0.1:18080/assets/attachment-style)"
          intervention_css="$(curl --fail --silent http://127.0.0.1:18080/assets/intervention-style)"
          grep -F '.chat-workspace' <<<"${conversation_css}"
          grep -F '.chat-composer' <<<"${conversation_css}"
          grep -F '.chat-attachment-item' <<<"${attachment_css}"
          grep -F '.intervention-panel' <<<"${intervention_css}"
          runtime_js="$(curl --fail --silent http://127.0.0.1:18080/assets/chat-runtime)"
          attachment_js="$(curl --fail --silent http://127.0.0.1:18080/assets/chat-attachments)"
          intervention_js="$(curl --fail --silent http://127.0.0.1:18080/assets/chat-interventions)"
          grep -F 'aiAgent.execAgent' <<<"${runtime_js}"
          grep -F 'aiAgent.getOperationStatus' <<<"${runtime_js}"
          grep -F 'file.checkFileHash' <<<"${attachment_js}"
          grep -F 'upload.createS3PreSignedUrl' <<<"${attachment_js}"
          grep -F 'file.createFile' <<<"${attachment_js}"
          grep -F 'value.json.fileIds' <<<"${attachment_js}"
          grep -F 'aiAgent.getPendingInterventions' <<<"${intervention_js}"
          grep -F 'aiAgent.processHumanIntervention' <<<"${intervention_js}"
          grep -F "action: 'approve'" <<<"${intervention_js}"
          grep -F "action: 'reject_continue'" <<<"${intervention_js}"
          session="$(curl --fail --silent http://127.0.0.1:18080/api/auth/get-session)"
          grep -F '"session":null' <<<"${session}"
          topics="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/topic.queryTopics?input=%7B%22json%22%3A%7B%7D%7D')"
          transcript="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/topic.getTopicTranscript?input=%7B%22json%22%3A%7B%22topicId%22%3A%22topic-fixture%22%7D%7D')"
          agents="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/agent.queryAgents?input=%7B%22json%22%3A%7B%22limit%22%3A100%2C%22offset%22%3A0%7D%7D')"
          hash_check="$(curl --fail --silent -H 'Content-Type: application/json' -X POST --data '{"json":{"hash":"fixture-hash"}}' http://127.0.0.1:18080/trpc/file.checkFileHash)"
          signed_url="$(curl --fail --silent -H 'Content-Type: application/json' -X POST --data '{"json":{"pathname":"files/fixture/file.txt"}}' http://127.0.0.1:18080/trpc/upload.createS3PreSignedUrl)"
          file_record="$(curl --fail --silent -H 'Content-Type: application/json' -X POST --data '{"json":{"fileType":"text/plain","hash":"fixture-hash","metadata":{"path":"files/fixture/file.txt"},"name":"file.txt","size":7,"source":"sumeme-chat","url":"files/fixture/file.txt"}}' http://127.0.0.1:18080/trpc/file.createFile)"
          execution="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"json":{"agentId":"agent-fixture","appContext":{"scope":"main","topicId":"topic-fixture"},"autoStart":true,"fileIds":["file-fixture"],"prompt":"Fixture prompt","trigger":"chat"}}' \
            http://127.0.0.1:18080/trpc/aiAgent.execAgent)"
          operation="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/aiAgent.getOperationStatus?input=%7B%22json%22%3A%7B%22historyLimit%22%3A6%2C%22includeHistory%22%3Afalse%2C%22operationId%22%3A%22operation-fixture%22%7D%7D')"
          pending="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/aiAgent.getPendingInterventions?input=%7B%22json%22%3A%7B%22operationId%22%3A%22operation-fixture%22%7D%7D')"
          intervention="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"json":{"action":"approve","data":{"approvedToolCall":{"apiName":"fixtureTool","arguments":"{\"value\":1}","id":"call-fixture","identifier":"fixture-plugin"}},"operationId":"operation-fixture","stepIndex":2,"toolMessageId":"tool-message-fixture"}}' \
            http://127.0.0.1:18080/trpc/aiAgent.processHumanIntervention)"
          grep -F 'Fixture conversation' <<<"${topics}"
          grep -F 'Fixture transcript' <<<"${transcript}"
          grep -F 'tool-message-fixture' <<<"${transcript}"
          grep -F 'Fixture agent' <<<"${agents}"
          grep -F '"isExist":false' <<<"${hash_check}"
          grep -F 'signed-upload' <<<"${signed_url}"
          grep -F 'file-fixture' <<<"${file_record}"
          grep -F 'operation-fixture' <<<"${execution}"
          grep -F 'waiting_for_human' <<<"${operation}"
          grep -F 'tool_approval' <<<"${pending}"
          grep -F 'call-fixture' <<<"${pending}"
          grep -F '"success":true' <<<"${intervention}"
          asset="$(curl --fail --silent http://127.0.0.1:18080/_spa-auth/assets/probe.js)"
          grep -F 'auth fixture' <<<"${asset}"
          if grep -F '<script src="/_spa-auth/' <<<"${page}"; then
            echo 'Visible SuMeMe page still depends on the old auth SPA.' >&2
            exit 1
          fi
      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs sumeme-web-test || true
          docker logs lobe || true
          docker logs memory-gateway || true
      - name: Stop test containers
        if: always()
        run: |
          docker rm -f sumeme-web-test lobe memory-gateway >/dev/null 2>&1 || true
          docker network rm sumeme-ui-test >/dev/null 2>&1 || true
