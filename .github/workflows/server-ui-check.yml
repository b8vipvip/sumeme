name: Server UI check

on:
  pull_request:
    paths:
      - "web/server-ui/**"
      - "docker-compose.yml"
      - "scripts/health-check.sh"
      - "scripts/smoke-public-ui.py"
      - "tests/test_public_ui_delivery_contract.py"
      - ".github/workflows/server-ui-check.yml"
  push:
    branches: [main]
    paths:
      - "web/server-ui/**"
      - "docker-compose.yml"
      - "scripts/health-check.sh"
      - "scripts/smoke-public-ui.py"
      - "tests/test_public_ui_delivery_contract.py"
      - ".github/workflows/server-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile public UI smoke test
        run: python -m py_compile scripts/smoke-public-ui.py
      - name: Check frontend JavaScript syntax
        run: node --check web/server-ui/static/app.js
      - name: Run frontend and backend-boundary contract
        run: python -m unittest tests.test_public_ui_delivery_contract -v
      - name: Build server UI container
        run: docker build -t sumeme-web:test web/server-ui
      - name: Start isolated LobeHub fixture, gateway and server UI
        run: |
          set -euo pipefail
          docker network create sumeme-ui-test
          fixture="${RUNNER_TEMP}/lobe-fixture.conf"
          cat > "${fixture}" <<'EOF'
          server {
            listen 3210;
            location = /api/auth/get-session {
              default_type application/json;
              return 200 '{"session":null,"user":null}';
            }
            location = /trpc/topic.queryTopics {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"items":[{"id":"topic-fixture","title":"Fixture conversation","updatedAt":"2026-07-31T10:00:00Z","lastMessage":{"content":"Fixture preview"}}]}}}}';
            }
            location = /trpc/topic.getTopicTranscript {
              default_type application/json;
              return 200 '{"result":{"data":{"json":{"items":[{"id":"message-fixture","role":"assistant","content":"Fixture transcript","createdAt":"2026-07-31T10:01:00Z"}]}}}}';
            }
            location /_spa-auth/ {
              default_type application/javascript;
              return 200 'console.log("auth fixture")';
            }
            location / {
              default_type text/plain;
              return 200 'lobe backend fixture';
            }
          }
          EOF
          docker run -d \
            --name lobe \
            --network sumeme-ui-test \
            -v "${fixture}:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          docker run -d \
            --name memory-gateway \
            --network sumeme-ui-test \
            nginx:1.27-alpine
          docker run -d \
            --name sumeme-web-test \
            --network sumeme-ui-test \
            -p 127.0.0.1:18080:80 \
            sumeme-web:test
      - name: Verify frontend, login route and LobeHub proxy
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            echo 'sumeme-web did not become ready.' >&2
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/healthz | python -m json.tool >/dev/null
          page="$(curl --fail --silent http://127.0.0.1:18080/)"
          signin="$(curl --fail --silent 'http://127.0.0.1:18080/signin?callbackUrl=%2F')"
          grep -F '<title>SuMeMe · 服务端</title>' <<<"${page}"
          grep -F '服务端管理中心' <<<"${page}"
          grep -F 'SUMEME OPERATIONS CENTER' <<<"${page}"
          grep -F 'id="topicList"' <<<"${page}"
          grep -F '第一阶段 · 安全只读' <<<"${page}"
          grep -F '/assets/conversation-style' <<<"${page}"
          grep -F '登录 SuMeMe' <<<"${signin}"
          curl --fail --silent http://127.0.0.1:18080/static/admin.css >/dev/null
          curl --fail --silent http://127.0.0.1:18080/static/app.js >/dev/null
          conversation_css="$(curl --fail --silent http://127.0.0.1:18080/assets/conversation-style)"
          grep -F '.chat-workspace' <<<"${conversation_css}"
          session="$(curl --fail --silent http://127.0.0.1:18080/api/auth/get-session)"
          grep -F '"session":null' <<<"${session}"
          topics="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/topic.queryTopics?input=%7B%22json%22%3A%7B%7D%7D')"
          transcript="$(curl --fail --silent 'http://127.0.0.1:18080/trpc/topic.getTopicTranscript?input=%7B%22json%22%3A%7B%22topicId%22%3A%22topic-fixture%22%7D%7D')"
          grep -F 'Fixture conversation' <<<"${topics}"
          grep -F 'Fixture transcript' <<<"${transcript}"
          asset="$(curl --fail --silent http://127.0.0.1:18080/_spa-auth/assets/probe.js)"
          grep -F 'auth fixture' <<<"${asset}"
          if grep -F '<script src="/_spa-auth/' <<<"${page}"; then
            echo 'Visible SuMeMe page still depends on the old auth SPA.' >&2
            exit 1
          fi
      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs sumeme-web-test || true
          docker logs lobe || true
          docker logs memory-gateway || true
      - name: Stop test containers
        if: always()
        run: |
          docker rm -f sumeme-web-test lobe memory-gateway >/dev/null 2>&1 || true
          docker network rm sumeme-ui-test >/dev/null 2>&1 || true
