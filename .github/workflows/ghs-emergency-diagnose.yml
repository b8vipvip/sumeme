name: GHS emergency diagnostics

on:
  push:
    branches:
      - agent/ghs-emergency-diagnose
    paths:
      - .github/workflows/ghs-emergency-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Read sanitized production diagnostics using GHS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate GHS connection inputs
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${SSH_PORT}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"

      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/adob_deploy"
          printf '%s\n' "${SSH_HOST_KEY}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/adob_deploy" "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host adob-production
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/adob_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 "${HOME}/.ssh/config"
          ssh adob-production 'printf "ghs-diagnostics-ready\n"'

      - name: Read bounded production state and redacted logs
        shell: bash
        run: |
          set -euo pipefail
          ssh adob-production 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/sumeme
          echo '== Docker services =='
          docker compose ps || true
          echo '== Letta health state =='
          docker inspect --format '{{json .State}}' sumeme-letta 2>/dev/null || true
          echo '== Memory gateway health state =='
          docker inspect --format '{{json .State}}' sumeme-memory-gateway 2>/dev/null || true
          echo '== Redacted Letta logs =='
          DEPLOY_DIR=/opt/sumeme bash scripts/show-logs.sh letta 300 2h || true
          echo '== Redacted memory-gateway logs =='
          DEPLOY_DIR=/opt/sumeme bash scripts/show-logs.sh memory-gateway 200 2h || true
          echo '== Persistent smoke result =='
          python3 - <<'PY' || true
          import json
          from pathlib import Path

          path = Path('/opt/sumeme/.deploy/smoke/latest.json')
          if not path.exists():
              print('missing')
              raise SystemExit(0)
          value = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'generated_at': value.get('generated_at'),
              'overall': value.get('overall'),
              'deployment_gate': value.get('deployment_gate'),
              'checks': value.get('checks'),
              'write_components': value.get('write_components'),
              'recall_components': value.get('recall_components'),
              'error_codes': value.get('error_codes'),
          }, ensure_ascii=False))
          PY
          REMOTE
