name: GHS emergency diagnostics

on:
  push:
    branches:
      - agent/ghs-emergency-diagnose
    paths:
      - .github/workflows/ghs-emergency-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    name: Publish sanitized production diagnostics using GHS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate GHS connection inputs
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${SSH_PORT}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"

      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/adob_deploy"
          printf '%s\n' "${SSH_HOST_KEY}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/adob_deploy" "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host adob-production
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/adob_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 "${HOME}/.ssh/config"
          ssh adob-production 'printf "ghs-diagnostics-ready\n"'

      - name: Collect bounded production state
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh adob-production "EXPECTED_MAIN_SHA='${EXPECTED_MAIN_SHA}' python3 -" > "${RUNNER_TEMP}/ghs-status.json" <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          deploy_dir = Path('/opt/sumeme')
          state_dir = deploy_dir / '.deploy'

          def read(path: Path) -> str:
              try:
                  return path.read_text(encoding='utf-8').strip()
              except OSError:
                  return ''

          def read_environment(path: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except OSError:
                  return values
              for raw in lines:
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                      value = value[1:-1]
                  values[key.strip()] = value
              return values

          def run(command: list[str]) -> dict[str, object]:
              try:
                  result = subprocess.run(
                      command,
                      cwd=deploy_dir,
                      capture_output=True,
                      text=True,
                      timeout=30,
                      check=False,
                  )
                  return {
                      'ok': result.returncode == 0,
                      'returncode': result.returncode,
                      'stdout': result.stdout.strip()[:20000],
                      'stderr': result.stderr.strip()[:2000],
                  }
              except Exception as exc:
                  return {'ok': False, 'returncode': -1, 'stdout': '', 'stderr': type(exc).__name__}

          def http(url: str) -> dict[str, object]:
              try:
                  with urllib.request.urlopen(url, timeout=8) as response:
                      return {'ok': 200 <= response.status < 300, 'status': response.status}
              except urllib.error.HTTPError as exc:
                  return {'ok': False, 'status': exc.code}
              except Exception as exc:
                  return {'ok': False, 'status': None, 'error': type(exc).__name__}

          def safe_token(value: object) -> str | None:
              text = str(value or '').strip()
              return text if re.fullmatch(r'[A-Za-z0-9._:-]{1,120}', text) else None

          def classify_body(body: bytes) -> dict[str, str]:
              try:
                  value = json.loads(body.decode('utf-8', errors='replace'))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  return {}
              if not isinstance(value, dict):
                  return {}
              result: dict[str, str] = {}
              detail = safe_token(value.get('detail'))
              if detail:
                  result['detail'] = detail
              error = value.get('error')
              if isinstance(error, dict):
                  code = safe_token(error.get('code'))
                  error_type = safe_token(error.get('type'))
                  if code:
                      result['error_code'] = code
                  if error_type:
                      result['error_type'] = error_type
              return result

          def post_json(url: str, headers: dict[str, str], payload: dict[str, object]) -> dict[str, object]:
              body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(url, data=body, method='POST')
              for key, value in headers.items():
                  request.add_header(key, value)
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      response_body = response.read(10000)
                      return {
                          'ok': 200 <= response.status < 300,
                          'status': response.status,
                          **classify_body(response_body),
                      }
              except urllib.error.HTTPError as exc:
                  response_body = exc.read(10000)
                  return {'ok': False, 'status': exc.code, **classify_body(response_body)}
              except Exception as exc:
                  return {'ok': False, 'status': None, 'error': type(exc).__name__}

          ps = run(['docker', 'compose', 'ps', '--format', 'json'])
          records: list[dict[str, object]] = []
          raw = str(ps.get('stdout') or '')
          if raw:
              try:
                  parsed = json.loads(raw)
                  records = parsed if isinstance(parsed, list) else [parsed]
              except json.JSONDecodeError:
                  for line in raw.splitlines():
                      try:
                          item = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(item, dict):
                          records.append(item)

          services = []
          for item in records:
              services.append({
                  'service': item.get('Service') or item.get('service'),
                  'state': item.get('State') or item.get('state'),
                  'health': item.get('Health') or item.get('health'),
                  'status': item.get('Status') or item.get('status'),
              })

          smoke = {}
          smoke_path = state_dir / 'smoke' / 'latest.json'
          try:
              value = json.loads(smoke_path.read_text(encoding='utf-8'))
              smoke = {
                  'generated_at': value.get('generated_at'),
                  'overall': value.get('overall'),
                  'deployment_gate': value.get('deployment_gate'),
                  'checks': value.get('checks'),
                  'write_components': value.get('write_components'),
                  'recall_components': value.get('recall_components'),
                  'error_codes': value.get('error_codes'),
              }
          except (OSError, json.JSONDecodeError):
              smoke = {'status': 'missing_or_invalid'}

          environment = read_environment(deploy_dir / '.env')
          relay_base = environment.get('OPENAI_RELAY_BASE_URL', '').rstrip('/')
          relay_key = environment.get('OPENAI_RELAY_API_KEY', '')
          gateway_key = environment.get('GATEWAY_API_KEY', '')
          model = environment.get('OPENAI_CHAT_MODEL', '')
          probe_payload = {
              'model': model,
              'stream': False,
              'user': '__sumeme_smoke__',
              'metadata': {
                  'conversation_id': 'sumeme-ghs-diagnostic',
                  'vault_id': 'production-smoke',
                  'device_id': 'ghs-diagnostic',
              },
              'messages': [{'role': 'user', 'content': 'Reply with GHS_DIAGNOSTIC_OK only.'}],
          }
          probes: dict[str, object] = {}
          if relay_base and relay_key and model:
              probes['direct_relay_chat'] = post_json(
                  f'{relay_base}/chat/completions',
                  {'Authorization': f'Bearer {relay_key}', 'Content-Type': 'application/json'},
                  probe_payload,
              )
          else:
              probes['direct_relay_chat'] = {'ok': False, 'status': None, 'error': 'configuration_missing'}
          if gateway_key and model:
              probes['local_gateway_chat'] = post_json(
                  'http://127.0.0.1:8010/v1/chat/completions',
                  {'Authorization': f'Bearer {gateway_key}', 'Content-Type': 'application/json'},
                  probe_payload,
              )
          else:
              probes['local_gateway_chat'] = {'ok': False, 'status': None, 'error': 'configuration_missing'}

          status = {
              'schema_version': 2,
              'mode': 'GHS',
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'workflow_source_sha': os.environ.get('EXPECTED_MAIN_SHA', ''),
              'deployment': {
                  'current_sha': read(state_dir / 'current_sha'),
                  'previous_sha': read(state_dir / 'previous_sha'),
                  'deploying_sha': read(state_dir / 'deploying_sha'),
              },
              'health': {
                  'local_gateway': http('http://127.0.0.1:8010/health'),
                  'public': http('https://sumeme.mv3.cn/sumeme-health'),
              },
              'services': sorted(services, key=lambda item: str(item.get('service') or '')),
              'probes': probes,
              'smoke': smoke,
          }
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
          python3 -m json.tool "${RUNNER_TEMP}/ghs-status.json" >/dev/null

      - name: Read redacted failure logs
        shell: bash
        run: |
          set -euo pipefail
          ssh adob-production 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/sumeme
          echo '== Docker services =='
          docker compose ps || true
          echo '== Redacted Letta logs =='
          DEPLOY_DIR=/opt/sumeme bash scripts/show-logs.sh letta 300 2h || true
          echo '== Redacted memory-gateway logs =='
          DEPLOY_DIR=/opt/sumeme bash scripts/show-logs.sh memory-gateway 200 2h || true
          REMOTE

      - name: Publish GHS status snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS_REPO="${RUNNER_TEMP}/sumeme-ghs-status"
          rm -rf "${STATUS_REPO}"
          mkdir -p "${STATUS_REPO}"
          cd "${STATUS_REPO}"
          git init
          git config user.name 'sumeme-ghs-status-bot'
          git config user.email 'sumeme-ghs-status-bot@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin ghs-status >/dev/null 2>&1; then
            git fetch --depth=1 origin ghs-status
            git checkout -B ghs-status FETCH_HEAD
          else
            git checkout --orphan ghs-status
          fi
          mkdir -p status
          cp "${RUNNER_TEMP}/ghs-status.json" status/status.json
          git add status/status.json
          if git diff --cached --quiet; then
            echo 'GHS status snapshot is unchanged.'
            exit 0
          fi
          git commit -m 'status(ghs): update production snapshot'
          git push origin HEAD:ghs-status

