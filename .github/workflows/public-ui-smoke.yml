name: Public UI smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-ui:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile UI smoke script
        run: python -m py_compile scripts/smoke-public-ui.py
      - name: Verify public HTML, assets, login and LobeHub auth
        run: python scripts/smoke-public-ui.py https://sumeme.mv3.cn/
      - name: Verify FDEX-derived SuMeMe management center
        run: |
          set -euo pipefail
          page="$(curl --fail --silent --show-error --location --max-time 30 https://sumeme.mv3.cn/)"
          grep -F '<title>SuMeMe · 服务端</title>' <<<"${page}"
          grep -F '服务端管理中心' <<<"${page}"
          grep -F 'SUMEME OPERATIONS CENTER' <<<"${page}"
          grep -F 'LobeHub 后端' <<<"${page}"

          signin="$(curl --fail --silent --show-error --location --max-time 30 'https://sumeme.mv3.cn/signin?callbackUrl=%2F')"
          grep -F '登录 SuMeMe' <<<"${signin}"

          curl --fail --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            https://sumeme.mv3.cn/api/auth/get-session >/dev/null
