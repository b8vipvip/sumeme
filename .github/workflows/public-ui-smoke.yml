name: Public UI smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile UI smoke script
        run: python -m py_compile scripts/smoke-public-ui.py
      - name: Verify public HTML and referenced assets
        run: python scripts/smoke-public-ui.py https://sumeme.mv3.cn/
