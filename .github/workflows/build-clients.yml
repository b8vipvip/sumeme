name: Build Android and Windows clients

on:
  pull_request:
    paths:
      - "clients/sumeme_app/**"
      - "web/control-panel/**"
      - "scripts/materialize-flutter-client.py"
      - "scripts/prepare-client-web-ui.py"
      - ".github/workflows/build-clients.yml"
  push:
    branches: [main]
    paths:
      - "clients/sumeme_app/**"
      - "web/control-panel/**"
      - "scripts/materialize-flutter-client.py"
      - "scripts/prepare-client-web-ui.py"
      - ".github/workflows/build-clients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-web-ui:
    name: Prepare bundled LobeHub UI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOBEHUB_UPSTREAM_REF: v2.2.11
      APP_URL: https://sumeme.mv3.cn
      DATABASE_DRIVER: node
      DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
      KEY_VAULTS_SECRET: client-build-placeholder
      AUTH_SECRET: client-build-placeholder

    steps:
      - name: Check out SuMeMe client source
        uses: actions/checkout@v4

      - name: Check out pinned LobeHub source
        uses: actions/checkout@v4
        with:
          repository: lobehub/lobehub
          ref: ${{ env.LOBEHUB_UPSTREAM_REF }}
          path: .upstream/lobehub
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned LobeHub dependencies
        working-directory: .upstream/lobehub
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build desktop and authentication SPAs
        working-directory: .upstream/lobehub
        run: |
          set -euo pipefail
          pnpm run build:spa
          pnpm run build:spa:auth
          test -s dist/desktop/index.html
          test -s dist/auth/index.auth.html

      - name: Stage immutable client web assets
        run: |
          set -euo pipefail
          python3 scripts/prepare-client-web-ui.py \
            --desktop-dist .upstream/lobehub/dist/desktop \
            --auth-dist .upstream/lobehub/dist/auth \
            --output "${RUNNER_TEMP}/lobehub-ui" \
            --upstream-ref "${LOBEHUB_UPSTREAM_REF}"
          test -s "${RUNNER_TEMP}/lobehub-ui/bundle.json"

      - name: Upload bundled LobeHub UI
        uses: actions/upload-artifact@v4
        with:
          name: sumeme-lobehub-web-ui
          path: ${{ runner.temp }}/lobehub-ui
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: prepare-web-ui
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Download bundled LobeHub UI
        uses: actions/download-artifact@v4
        with:
          name: sumeme-lobehub-web-ui
          path: ${{ runner.temp }}/lobehub-ui
      - name: Materialize generated platform project
        run: >-
          python3 scripts/materialize-flutter-client.py
          --output "${RUNNER_TEMP}/sumeme_app"
          --web-ui "${RUNNER_TEMP}/lobehub-ui"
      - name: Analyze and test
        working-directory: ${{ runner.temp }}/sumeme_app
        run: |
          flutter analyze
          flutter test
      - name: Build development-signed release APK
        working-directory: ${{ runner.temp }}/sumeme_app
        run: >-
          flutter build apk --release
          --build-name 0.2.0
          --build-number "${GITHUB_RUN_NUMBER}"
      - name: Write build provenance
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "version=0.2.0+${GITHUB_RUN_NUMBER}"
            echo "lobehub=v2.2.11"
            echo "ui=bundled-loopback-proxy"
            flutter --version | head -n 1
          } > "${RUNNER_TEMP}/sumeme-app-build.txt"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sumeme-android-apk
          path: |
            ${{ runner.temp }}/sumeme_app/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/sumeme-app-build.txt
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE
    needs: prepare-web-ui
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Download bundled LobeHub UI
        uses: actions/download-artifact@v4
        with:
          name: sumeme-lobehub-web-ui
          path: ${{ runner.temp }}\lobehub-ui
      - name: Materialize generated platform project
        shell: pwsh
        run: >-
          python scripts/materialize-flutter-client.py
          --output "$env:RUNNER_TEMP\sumeme_app"
          --web-ui "$env:RUNNER_TEMP\lobehub-ui"
      - name: Analyze, test and build Windows application
        shell: pwsh
        run: |
          Push-Location "$env:RUNNER_TEMP\sumeme_app"
          try {
            flutter analyze
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            flutter test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            flutter build windows --release --build-name 0.2.0 --build-number "$env:GITHUB_RUN_NUMBER"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }
      - name: Package portable ZIP and installer EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sumeme_app\build\windows" -Recurse -Filter sumeme_app.exe |
            Select-Object -First 1
          if ($null -eq $exe) { throw "Windows executable was not produced" }

          $releaseDir = $exe.Directory.FullName
          $artifactDir = Join-Path $env:RUNNER_TEMP "sumeme-windows-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Compress-Archive -Path (Join-Path $releaseDir "*") `
            -DestinationPath (Join-Path $artifactDir "SuMeMe-Windows-Portable.zip") -Force

          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }

          & $iscc `
            "/DAppVersion=0.2.$env:GITHUB_RUN_NUMBER" `
            "/DBuildDir=$releaseDir" `
            "/DOutputDir=$artifactDir" `
            "$env:GITHUB_WORKSPACE\clients\sumeme_app\packaging\windows\sumeme.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @(
            "repository=$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_RUN_ID"
            "version=0.2.0+$env:GITHUB_RUN_NUMBER"
            "lobehub=v2.2.11"
            "ui=bundled-loopback-proxy"
            (flutter --version | Select-Object -First 1)
          ) | Set-Content -Encoding UTF8 (Join-Path $artifactDir "build-info.txt")
      - name: Upload Windows EXE and portable package
        uses: actions/upload-artifact@v4
        with:
          name: sumeme-windows-x64
          path: ${{ runner.temp }}/sumeme-windows-artifacts/*
          if-no-files-found: error
          retention-days: 30
