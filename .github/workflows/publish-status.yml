name: Publish project status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - CI
      - Deploy production
      - Diagnose production
      - Rollback production
      - Smoke production
    types: [completed]
    branches: [main]

concurrency:
  group: sumeme-project-status
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

jobs:
  publish:
    name: Publish project status (GHS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out trusted status collector
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build sanitized GitHub metadata snapshot locally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/github-status-snapshot.py \
            --output "${RUNNER_TEMP}/github-status.json"

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload bounded status collector bundle
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}"
          test -n "${SSH_PORT}"
          test -n "${SSH_USER}"

          remote_dir="/tmp/sumeme-status-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'REMOTE_STATUS_DIR=%s\n' "${remote_dir}" >> "${GITHUB_ENV}"

          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "rm -rf '${remote_dir}' && install -d -m 700 '${remote_dir}'"

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -P "${SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            scripts/collect-project-status.py \
            scripts/collect-project-status-ghs.py \
            scripts/enrich-project-status.py \
            "${RUNNER_TEMP}/github-status.json" \
            "${SSH_USER}@${SSH_HOST}:${remote_dir}/"

      - name: Collect sanitized production status through GHS
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_DIR=/opt/sumeme python3 '${REMOTE_STATUS_DIR}/collect-project-status-ghs.py' \
               --github-snapshot '${REMOTE_STATUS_DIR}/github-status.json' \
               --collector '${REMOTE_STATUS_DIR}/collect-project-status.py' \
               --json '${REMOTE_STATUS_DIR}/status.json' \
               --markdown '${REMOTE_STATUS_DIR}/STATUS.md' && \
             DEPLOY_DIR=/opt/sumeme python3 '${REMOTE_STATUS_DIR}/enrich-project-status.py' \
               --json '${REMOTE_STATUS_DIR}/status.json' \
               --markdown '${REMOTE_STATUS_DIR}/STATUS.md' \
               --smoke '/opt/sumeme/.deploy/smoke/latest.json' \
               --deploy-dir /opt/sumeme"

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -P "${SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_STATUS_DIR}/status.json" \
            "${RUNNER_TEMP}/status.json"

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -P "${SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_STATUS_DIR}/STATUS.md" \
            "${RUNNER_TEMP}/STATUS.md"

      - name: Remove remote temporary collector bundle
        if: always()
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
        run: |
          set +e
          if [[ -n "${REMOTE_STATUS_DIR:-}" && -n "${SSH_HOST:-}" && -n "${SSH_USER:-}" ]]; then
            ssh \
              -i "${HOME}/.ssh/id_ed25519" \
              -p "${SSH_PORT}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              "${SSH_USER}@${SSH_HOST}" \
              "rm -rf '${REMOTE_STATUS_DIR}'"
          fi

      - name: Publish snapshot to ops-status branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          STATUS_REPO="${RUNNER_TEMP}/sumeme-ops-status"
          rm -rf "${STATUS_REPO}"
          mkdir -p "${STATUS_REPO}"
          cd "${STATUS_REPO}"

          git init
          git config user.name "sumeme-status-bot"
          git config user.email "sumeme-status-bot@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin ops-status >/dev/null 2>&1; then
            git fetch --depth=1 origin ops-status
            git checkout -B ops-status FETCH_HEAD
          else
            git checkout --orphan ops-status
          fi

          mkdir -p status
          cp "${RUNNER_TEMP}/status.json" status/status.json
          cp "${RUNNER_TEMP}/STATUS.md" status/STATUS.md

          git add status/status.json status/STATUS.md
          if git diff --cached --quiet; then
            echo "Status snapshot is unchanged."
            exit 0
          fi

          git commit -m "status: update project snapshot"
          git push origin HEAD:ops-status

      - name: Print summary
        if: always()
        run: |
          echo "ADOB mode: GHS"
          echo "Status branch: ops-status"
          echo "Machine-readable: status/status.json"
          echo "Human-readable: status/STATUS.md"
