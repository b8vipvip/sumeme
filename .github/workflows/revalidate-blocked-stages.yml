name: Revalidate blocked stages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtualenv-build:
    name: Virtualenv compile, test, and image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate memory gateway in isolated virtualenv
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/gateway-venv"
          "${RUNNER_TEMP}/gateway-venv/bin/pip" install -r services/memory-gateway/requirements-dev.txt
          cd services/memory-gateway
          "${RUNNER_TEMP}/gateway-venv/bin/ruff" check app tests
          PYTHONPATH=. "${RUNNER_TEMP}/gateway-venv/bin/pytest" -q
          "${RUNNER_TEMP}/gateway-venv/bin/python" -m compileall app

      - name: Validate provider proxy in isolated virtualenv
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/proxy-venv"
          "${RUNNER_TEMP}/proxy-venv/bin/pip" install -r services/ai-provider-proxy/requirements-dev.txt
          cd services/ai-provider-proxy
          "${RUNNER_TEMP}/proxy-venv/bin/ruff" check app tests
          PYTHONPATH=. "${RUNNER_TEMP}/proxy-venv/bin/pytest" -q
          "${RUNNER_TEMP}/proxy-venv/bin/python" -m compileall app

      - name: Validate operational scripts
        run: |
          set -euo pipefail
          python -m compileall scripts tests
          python -m unittest discover -s tests -v
          bash -n scripts/*.sh
          mkdir -p "${RUNNER_TEMP}/disk-check" "${RUNNER_TEMP}/cleanup-check"
          DEPLOY_DIR="${RUNNER_TEMP}/disk-check" \
            DISK_WARN_PERCENT=99 DISK_FAIL_PERCENT=100 DISK_MIN_FREE_GIB=0 \
            bash scripts/preflight-disk.sh --json | python -m json.tool >/dev/null
          DEPLOY_DIR="${RUNNER_TEMP}/cleanup-check" bash scripts/cleanup-runtime.sh --dry-run

      - name: Validate Compose and build both local runtime images
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config >/dev/null
          docker build -t sumeme-memory-gateway:revalidate services/memory-gateway
          docker build -t sumeme-ai-provider-proxy:revalidate services/ai-provider-proxy

  production-recovery-and-smoke:
    name: GHS recover and rerun blocked production acceptance
    needs: virtualenv-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload trusted validation bundle
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}"
          test -n "${SSH_PORT}"
          test -n "${SSH_USER}"
          remote_dir="/tmp/sumeme-revalidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'REMOTE_DIR=%s\n' "${remote_dir}" >> "${GITHUB_ENV}"
          ssh -i "${HOME}/.ssh/id_ed25519" -p "${SSH_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "rm -rf '${remote_dir}' && install -d -m 700 '${remote_dir}'"
          scp -i "${HOME}/.ssh/id_ed25519" -P "${SSH_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            scripts/health-check.sh scripts/preflight-disk.sh \
            scripts/cleanup-runtime.sh scripts/smoke-private-object.sh \
            scripts/smoke-test.sh scripts/redact-log-stream.py \
            scripts/revalidate-production.sh \
            "${SSH_USER}@${SSH_HOST}:${remote_dir}/"

      - name: Recover production and rerun blocked acceptance
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/id_ed25519" -p "${SSH_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' DEPLOY_DIR=/opt/sumeme bash '${REMOTE_DIR}/revalidate-production.sh'"

      - name: Remove remote validation bundle
        if: always()
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
        run: |
          set +e
          if [[ -n "${REMOTE_DIR:-}" ]]; then
            ssh -i "${HOME}/.ssh/id_ed25519" -p "${SSH_PORT}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              "${SSH_USER}@${SSH_HOST}" "rm -rf '${REMOTE_DIR}'"
          fi
