name: Observe main deployment once

on:
  push:
    branches: [agent/observe-main-deploy-2]

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish sanitized workflow observation
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowFiles = [
              ['CI', 'ci.yml'],
              ['Deploy production', 'deploy-production.yml'],
              ['Smoke production', 'smoke-production.yml'],
              ['Publish project status', 'publish-status.yml'],
            ];
            const result = {
              schema_version: 1,
              generated_at: new Date().toISOString(),
              workflows: [],
            };

            for (const [label, workflowId] of workflowFiles) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'main',
                per_page: 10,
              });
              const workflow = { label, workflow_id: workflowId, runs: [] };
              for (const run of response.data.workflow_runs) {
                const item = {
                  run_number: run.run_number,
                  run_id: run.id,
                  sha: run.head_sha,
                  event: run.event,
                  status: run.status,
                  conclusion: run.conclusion,
                  created_at: run.created_at,
                  jobs: [],
                };
                if (label === 'CI' || label === 'Deploy production') {
                  const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100,
                    filter: 'latest',
                  });
                  item.jobs = jobsResponse.data.jobs.map((job) => ({
                    id: job.id,
                    name: job.name,
                    status: job.status,
                    conclusion: job.conclusion,
                    failed_steps: (job.steps || [])
                      .filter((step) => step.conclusion && !['success', 'skipped'].includes(step.conclusion))
                      .map((step) => ({name: step.name, conclusion: step.conclusion})),
                  }));
                }
                workflow.runs.push(item);
              }
              result.workflows.push(workflow);
            }

            const path = 'observer/latest.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner, repo, path, ref: 'ops-status',
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'ops-status',
              message: 'observer: update temporary deployment snapshot',
              content: Buffer.from(JSON.stringify(result, null, 2) + '\n').toString('base64'),
              sha,
            });

      - name: Configure pinned SSH trust
        env:
          SSH_HOST: ${{ vars.SUMEME_VPS_HOST }}
          SSH_PORT: ${{ vars.SUMEME_VPS_PORT || '22' }}
          SSH_USER: ${{ vars.SUMEME_VPS_USER || 'sumeme-runner' }}
          SSH_PRIVATE_KEY: ${{ secrets.SUMEME_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SUMEME_SSH_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/sumeme_observe"
          printf '%s\n' "${SSH_HOST_KEY}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/sumeme_observe" "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host sumeme-production
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/sumeme_observe
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "${HOME}/.ssh/config"

      - name: Read and reduce latest smoke result
        shell: bash
        run: |
          set -euo pipefail
          ssh sumeme-production 'cat /opt/sumeme/.deploy/smoke/latest.json' > /tmp/smoke.json
          jq '{
            schema_version,
            generated_at,
            duration_seconds,
            overall,
            deployment_gate,
            memory_provider,
            identity_mode,
            test_scope,
            require_recall,
            checks,
            write_components,
            recall_components,
            error_codes
          }' /tmp/smoke.json > /tmp/smoke-sanitized.json

      - name: Publish sanitized smoke result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'diagnostics/smoke-latest.json';
            const content = fs.readFileSync('/tmp/smoke-sanitized.json');
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner, repo, path, ref: 'ops-status',
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'ops-status',
              message: 'diagnostics: update sanitized smoke result',
              content: content.toString('base64'),
              sha,
            });
