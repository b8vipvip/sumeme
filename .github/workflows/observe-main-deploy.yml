name: Observe exact main deployment

on:
  push:
    branches: [agent/observe-main-deploy-2]

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish current exact main CI jobs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = '9e14dc225588fbc6c0b88ebb1c2552e30f1fca6e';
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              per_page: 30,
            });
            const selectedRun = runs.data.workflow_runs.find(
              (run) => run.head_sha === targetSha,
            ) || null;
            let jobs = [];
            if (selectedRun) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: selectedRun.id,
                per_page: 100,
                filter: 'latest',
              });
              jobs = response.data.jobs;
            }

            const result = {
              schema_version: 1,
              generated_at: new Date().toISOString(),
              target_sha: targetSha,
              run: selectedRun ? {
                id: selectedRun.id,
                number: selectedRun.run_number,
                status: selectedRun.status,
                conclusion: selectedRun.conclusion,
                created_at: selectedRun.created_at,
              } : null,
              jobs: jobs.map((job) => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                failed_steps: (job.steps || [])
                  .filter((step) => step.conclusion && !['success', 'skipped'].includes(step.conclusion))
                  .map((step) => ({
                    name: step.name,
                    conclusion: step.conclusion,
                  })),
              })),
            };

            const path = 'observer/provider-proxy-deploy.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'ops-status',
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'ops-status',
              message: 'observer: record provider proxy deployment snapshot',
              content: Buffer.from(JSON.stringify(result, null, 2) + '\n').toString('base64'),
              sha,
            });
