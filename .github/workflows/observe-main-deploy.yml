name: Observe main deployment once

on:
  push:
    branches: [agent/observe-main-deploy-2]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CI and deployment workflows directly
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowFiles = [
              ['CI', 'ci.yml'],
              ['Deploy production', 'deploy-production.yml'],
              ['Smoke production', 'smoke-production.yml'],
              ['Publish project status', 'publish-status.yml'],
            ];

            const lines = [
              '<!-- sumeme-main-deploy-observer-3-direct -->',
              '## Main CI/部署一次性直接观察结果（第三次）',
              '',
              `观察时间：${new Date().toISOString()}`,
              '',
            ];

            for (const [label, workflowId] of workflowFiles) {
              lines.push(`### ${label} (${workflowId})`);
              let runs;
              try {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: 'main',
                  per_page: 10,
                });
                runs = response.data.workflow_runs;
              } catch (error) {
                lines.push(`- 查询失败：${error.status || 'unknown'}`);
                continue;
              }

              if (!runs.length) {
                lines.push('- 没有 main 运行记录');
                continue;
              }

              for (const run of runs) {
                lines.push(`- #${run.run_number} run_id=${run.id} SHA=\`${run.head_sha.slice(0, 12)}\` event=${run.event} status=\`${run.status}\` conclusion=\`${run.conclusion || '-'}\` created=${run.created_at}`);
                if (label === 'CI' || label === 'Deploy production') {
                  const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100,
                    filter: 'latest',
                  });
                  for (const job of jobsResponse.data.jobs) {
                    lines.push(`  - job ${job.id} ${job.name}: \`${job.status}\` / \`${job.conclusion || '-'}\``);
                    for (const step of (job.steps || [])) {
                      if (step.conclusion && !['success', 'skipped'].includes(step.conclusion)) {
                        lines.push(`    - failed step: ${step.name} — \`${step.conclusion}\``);
                      }
                    }
                  }
                }
              }
              lines.push('');
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 4,
              body: lines.join('\n'),
            });
