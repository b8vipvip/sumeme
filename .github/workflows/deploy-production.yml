name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: sumeme-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 60

    steps:
      - name: Check out selected main release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify selected main release
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${GITHUB_SHA}"
          echo "Verified manual release SHA: ${actual}"

      - name: Deploy selected release to VPS
        env:
          DEPLOY_DIR: /opt/sumeme
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production.sh "${GITHUB_SHA}"

      - name: Print deployment state
        if: always()
        run: |
          echo "Expected release: ${GITHUB_SHA}"
          echo "Current release: $(cat /opt/sumeme/.deploy/current_sha 2>/dev/null || echo unknown)"
          tail -n 20 /opt/sumeme/.deploy/history.log 2>/dev/null || true
