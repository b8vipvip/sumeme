name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: sumeme-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 60

    steps:
      - name: Check out trusted main release
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Resolve release SHA
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Deploy to VPS
        env:
          DEPLOY_DIR: /opt/sumeme
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production.sh "${{ steps.release.outputs.sha }}"

      - name: Print deployment state
        if: always()
        run: |
          echo "Current release: $(cat /opt/sumeme/.deploy/current_sha 2>/dev/null || echo unknown)"
          tail -n 20 /opt/sumeme/.deploy/history.log 2>/dev/null || true