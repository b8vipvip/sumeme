name: Observe latest main CI once

on:
  push:
    branches: [agent/actions-observer]
    paths: [.github/workflows/observe-main-ci-once.yml]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish sanitized production runner queue
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
            });
            const body = [
              '<!-- sumeme-production-runner-observer -->',
              '## Production Runner 一次性队列观察结果',
              '',
            ];
            let found = 0;
            for (const run of runs.data.workflow_runs) {
              if (run.status === 'completed') continue;
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              for (const job of jobs.data.jobs) {
                const labels = Array.isArray(job.labels) ? job.labels : [];
                if (!labels.includes('sumeme-production') || job.status === 'completed') continue;
                found += 1;
                body.push(
                  `- workflow \`${run.name}\` run \`${run.run_number}\` / id \`${run.id}\`; ` +
                  `job \`${job.name}\`; run \`${run.status}\`; job \`${job.status}\`; ` +
                  `started \`${job.started_at || 'not-started'}\`; SHA \`${run.head_sha.slice(0, 12)}\``
                );
              }
            }
            if (found === 0) body.push('- 没有发现运行中或排队的 production Runner Job');
            body.push('', `观察时间：${new Date().toISOString()}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body: body.join('\n'),
            });
