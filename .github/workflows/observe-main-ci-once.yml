name: Observe latest main CI once

on:
  push:
    branches: [agent/actions-observer]
    paths: [.github/workflows/observe-main-ci-once.yml]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish sanitized main CI queue
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repo.data.default_branch,
            });
            const sha = branch.data.commit.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: repo.data.default_branch,
              event: 'push',
              per_page: 10,
            });
            const body = [
              '<!-- sumeme-main-ci-queue-observer -->',
              '## Main CI 部署队列一次性观察结果',
              '',
              `- main SHA: \`${sha}\``,
              '',
            ];
            for (const run of runs.data.workflow_runs) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const deploy = jobs.data.jobs.find((job) => job.name === 'Deploy production');
              body.push(
                `- run \`${run.run_number}\` / id \`${run.id}\` / SHA \`${run.head_sha.slice(0, 12)}\`: ` +
                `CI \`${run.status}\` / \`${run.conclusion || 'pending'}\`; ` +
                `deploy \`${deploy?.status || 'absent'}\` / \`${deploy?.conclusion || 'pending'}\``
              );
            }
            body.push('', `观察时间：${new Date().toISOString()}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body: body.join('\n'),
            });
