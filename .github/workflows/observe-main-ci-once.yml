name: Observe latest main CI once

on:
  push:
    branches: [agent/actions-observer]
    paths: [.github/workflows/observe-main-ci-once.yml]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish sanitized self-hosted runner state
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '<!-- sumeme-self-hosted-runner-observer -->',
              '## Self-hosted Runner 一次性观察结果',
              '',
            ];
            try {
              const response = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              if (response.data.runners.length === 0) {
                body.push('- 仓库没有注册 self-hosted runner');
              }
              for (const runner of response.data.runners) {
                const labels = (runner.labels || []).map((item) => item.name).join(', ');
                body.push(
                  `- \`${runner.name}\`: status \`${runner.status}\`; busy \`${runner.busy}\`; ` +
                  `labels \`${labels || 'none'}\``
                );
              }
            } catch (error) {
              body.push(`- Runner API 查询失败：\`${error.status || 'unknown'}\``);
            }
            body.push('', `观察时间：${new Date().toISOString()}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body: body.join('\n'),
            });
