name: Diagnose production

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to inspect
        required: true
        type: choice
        default: memory-gateway
        options:
          - memory-gateway
          - lobe
          - letta
          - postgresql
          - qdrant
          - redis
          - rustfs
          - searxng
      lines:
        description: Number of log lines
        required: true
        type: choice
        default: '200'
        options:
          - '100'
          - '200'
          - '500'
      since:
        description: Log time window
        required: true
        type: choice
        default: 30m
        options:
          - 15m
          - 30m
          - 2h
          - 1d

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, sumeme-production]
    timeout-minutes: 15

    steps:
      - name: Check out diagnostics tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Container status
        run: |
          cd /opt/sumeme
          docker compose ps

      - name: Health check
        continue-on-error: true
        run: DEPLOY_DIR=/opt/sumeme bash scripts/health-check.sh

      - name: Redacted service logs
        run: |
          DEPLOY_DIR=/opt/sumeme bash scripts/show-logs.sh \
            '${{ inputs.service }}' '${{ inputs.lines }}' '${{ inputs.since }}'