map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Baota outer proxies may intercept public .css/.js paths. The public client
    # therefore continues to use extensionless resources supplied here.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/static/admin.css"' 'href="/assets/admin-style?legacy=/static/admin.css"';
    sub_filter 'src="/static/app.js"' 'src="/assets/app-script?legacy=/static/app.js"';
    sub_filter '</head>' '<link rel="stylesheet" href="/assets/conversation-style"><link rel="stylesheet" href="/assets/attachment-style"><link rel="stylesheet" href="/assets/intervention-style"><link rel="stylesheet" href="/assets/files-style"><link rel="stylesheet" href="/assets/memory-style"></head>';
    sub_filter '</body>' '<script src="/assets/chat-runtime" defer></script><script src="/assets/chat-attachments" defer></script><script src="/assets/chat-interventions" defer></script><script src="/assets/files-manager" defer></script><script src="/assets/memory-manager" defer></script><script src="/assets/client-branding" defer></script></body>';

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"sumeme-web","public_client":true,"admin_console":"/admin/","lobehub_backend":true}';
    }

    location = /sumeme-health {
        proxy_pass http://memory-gateway:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Public native-client API. Authentication comes from the LobeHub Better Auth
    # session cookie, never from a client-side relay or administrator token.
    location ^~ /api/client/ {
        proxy_pass http://memory-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Independent administration API. It is protected by its own Secure,
    # HttpOnly, SameSite=Strict session and is never used by the public client.
    location ^~ /api/admin/ {
        proxy_pass http://memory-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/gateway/ {
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass http://memory-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /assets/admin-style {
        alias /usr/share/nginx/html/static/admin.css;
        default_type text/css;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /assets/conversation-style {
        alias /usr/share/nginx/html/static/conversations.css;
        default_type text/css;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /assets/attachment-style {
        alias /usr/share/nginx/html/static/chat-attachments.css;
        default_type text/css;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/intervention-style {
        alias /usr/share/nginx/html/static/chat-interventions.css;
        default_type text/css;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/files-style {
        alias /usr/share/nginx/html/static/files-manager.css;
        default_type text/css;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/memory-style {
        alias /usr/share/nginx/html/static/memory-manager.css;
        default_type text/css;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/app-script {
        alias /usr/share/nginx/html/static/app.js;
        default_type application/javascript;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /assets/client-branding {
        alias /usr/share/nginx/html/static/client-branding.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/chat-runtime {
        alias /usr/share/nginx/html/static/chat-write.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/chat-attachments {
        alias /usr/share/nginx/html/static/chat-attachments.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/chat-interventions {
        alias /usr/share/nginx/html/static/chat-interventions.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/files-manager {
        alias /usr/share/nginx/html/static/files-manager.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /assets/memory-manager {
        alias /usr/share/nginx/html/static/memory-manager.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location ^~ /static/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Independent server administration UI. It intentionally contains no chat,
    # memory browser, file library or other public-client elements.
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/assets/style {
        alias /usr/share/nginx/html/admin/admin.css;
        default_type text/css;
        expires 5m;
        add_header Cache-Control "private, max-age=300";
    }

    location = /admin/assets/runtime {
        alias /usr/share/nginx/html/admin/admin.js;
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "private, max-age=300";
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store";
    }

    # SuMeMe owns the visual login and signup pages. Better Auth remains in LobeHub.
    location = /signin {
        try_files /index.html =404;
    }

    location = /signup {
        try_files /index.html =404;
    }

    # Registration is routed through the control plane so the administrator can
    # enable or disable public signup without exposing any server secret.
    location = /api/auth/sign-up/email {
        proxy_pass http://memory-gateway:8000/api/client/auth/sign-up/email;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /api/auth/ {
        proxy_pass http://lobe:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect http://lobe:3210/ /;
    }

    # Preserve LobeHub application APIs, conversations, files and settings data.
    location ^~ /trpc/ {
        proxy_pass http://lobe:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /api/ {
        proxy_pass http://lobe:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /oidc/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_spa-auth/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location ^~ /_spa/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location ^~ /_next/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
