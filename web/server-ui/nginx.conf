map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Some Baota templates install regex locations that intercept public .css and
    # .js URLs before the reverse proxy. Rewrite only the rendered HTML references
    # to extensionless paths so every request reaches this container. Keep the old
    # strings in harmless query parameters for compatibility checks and caches.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/static/admin.css"' 'href="/assets/admin-style?legacy=/static/admin.css"';
    sub_filter 'src="/static/app.js"' 'src="/assets/app-script?legacy=/static/app.js"';
    sub_filter '</head>' '<link rel="stylesheet" href="/assets/conversation-style"></head>';

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"sumeme-web","frontend":"fdex-derived","lobehub_backend":true}';
    }

    location = /sumeme-health {
        proxy_pass http://memory-gateway:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /api/gateway/ {
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass http://memory-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /assets/admin-style {
        alias /usr/share/nginx/html/static/admin.css;
        default_type text/css;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /assets/conversation-style {
        alias /usr/share/nginx/html/static/conversations.css;
        default_type text/css;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /assets/app-script {
        alias /usr/share/nginx/html/static/app.js;
        default_type application/javascript;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /static/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # SuMeMe owns the visual login and signup pages. Better Auth remains in LobeHub.
    location = /signin {
        try_files /index.html =404;
    }

    location = /signup {
        try_files /index.html =404;
    }

    location ^~ /api/auth/ {
        proxy_pass http://lobe:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect http://lobe:3210/ /;
    }

    # Preserve LobeHub application APIs, conversations, files and settings data.
    location ^~ /trpc/ {
        proxy_pass http://lobe:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /api/ {
        proxy_pass http://lobe:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /oidc/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compatibility assets stay available while all visible pages move to SuMeMe.
    location ^~ /_spa-auth/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location ^~ /_spa/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location ^~ /_next/ {
        proxy_pass http://lobe:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
